name: Bug Report
description: Report a problem or unexpected behavior
body:
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What is happening?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start the application
        2. Perform an action
        3. Observe the bug
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Logs, screenshots, or other useful details.
    validations:
      required: false
